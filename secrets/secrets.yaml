apiVersion: v1
kind: Pod
metadata:
  name: my-secret-pod
spec:
  containers:
    - name: secret-cont 
      image: nginx
      ports:
        - containerPort: 80

      volumeMounts:
        - name: my-secret
          mountPath: /etc/secrets
  
  volumes:
    - name: my-secret
      secret:
        secretName: db-secret

