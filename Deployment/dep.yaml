apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-dep
  annotations:
    kubernetes.io/change-cause: "v-3.0"
spec:
  replicas: 3
  selector:
    matchExpressions:
      - key: env
        operator: In
        values:
          - testing
          - prod
  template:
    metadata:
      name: mydeply
      labels:
        env: prod
        env: testing
    spec:
      containers:
        - name: my-cont
          image: nginx
          ports:
            - containerPort: 80