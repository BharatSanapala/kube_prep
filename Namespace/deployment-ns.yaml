apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-ns-deployment
  namespace: test
spec:
  replicas: 3
  selector:
    matchLabels:
      env: test
  template:
    metadata:
      labels:
        env: test
    spec:
      containers:
        - name: my-cont
          image: nginx
          ports:
            - containerPort: 80