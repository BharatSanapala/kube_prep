apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metdata:
  name: my-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: my-dep
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilzation: 60

    - type:  Resource
      resource:
        name: memory
        target:
          type: Utlization
          averageUtilization: 60